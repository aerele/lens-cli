[project]
name = "lens-cli"
version = "0.1.0"
description = "Lens code audit, at git commit time."
requires-python = ">=3.10"
dependencies = [
  "typer>=0.12",
  "httpx>=0.27",
  "rich>=13",
  "pyyaml>=6",
  "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
lens = "lens_cli.cli:app"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-httpx>=0.30"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lens_cli"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

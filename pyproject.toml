[project]
name = "lens-cli"
version = "0.2.0"
description = "Lens code audit, at git commit time."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Aerele Technologies", email = "support-lens@aerele.in" }]
keywords = ["frappe", "erpnext", "pre-commit", "code-audit", "static-analysis"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "typer>=0.12",
  "httpx>=0.27",
  "rich>=13",
  "pyyaml>=6",
  "tomli>=2.0; python_version < '3.11'",
]

[project.urls]
Homepage = "https://lens.aerele.in"
Repository = "https://github.com/aerele/lens-cli"

[project.scripts]
lens = "lens_cli.cli:app"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-httpx>=0.30"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lens_cli"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
